name: Release

on:
  push:
    tags:
      - 'v*'
    branches:  # <-- Ajoute cette section
      - test-workflow  # <-- Déclenche sur push vers test-workflow
  workflow_dispatch:
  
jobs:
  build:
    strategy:
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-5.0-dev libappindicator3-dev librsvg2-dev

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          choco install webview2-runtime

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install JS dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          includeUpdaterJson: true

      - name: Rename artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          mv src-tauri/target/release/bundle/msi/*.msi voice-pitch-widget_${{ github.ref_name }}_x64.msi
          mv src-tauri/target/release/bundle/nsis/*.exe voice-pitch-widget_${{ github.ref_name }}_x64.exe

      - name: Rename artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mv src-tauri/target/release/bundle/dmg/*.dmg voice-pitch-widget_${{ github.ref_name }}_x64.dmg
          mv src-tauri/target/release/bundle/macos/*.app.zip voice-pitch-widget_${{ github.ref_name }}_x64.dmg.zip

      - name: Rename artifacts (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mv src-tauri/target/release/bundle/appimage/*.AppImage voice-pitch-widget_${{ github.ref_name }}_x64.AppImage
          mv src-tauri/target/release/bundle/deb/*.deb voice-pitch-widget_${{ github.ref_name }}_amd64.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-${{ matrix.platform }}-${{ github.ref_name }}
          path: |
            voice-pitch-widget_*.exe
            voice-pitch-widget_*.msi
            voice-pitch-widget_*.dmg
            voice-pitch-widget_*.AppImage
            voice-pitch-widget_*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
          generate_release_notes: true