[package]
name = "voice-pitch-widget"
version = "0.1.0"
description = "Widget de détection de hauteur de voix, toujours au premier plan"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "voice-pitch-widget"
path = "src/main.rs"
