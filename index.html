<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pitch</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- data-tauri-drag-region permet de déplacer la fenêtre sans barre de titre -->
    <main data-tauri-drag-region class="widget">
      <button id="close-btn" title="Fermer">×</button>
      <button id="settings-btn" title="Réglages">⚙</button>

      <section id="main-view">
        <div class="freq-display">
          <span id="note">--</span>
          <span id="freq">-- Hz</span>
        </div>

        <div id="status-display">
          <button id="toggle-btn">Démarrer</button>
          <div id="status" class="status">Micro inactif</div>
        </div>
      </section>

      <section id="settings-view" class="hidden">
        <label class="setting-row">
          <span>Sens.&nbsp;(RMS)</span>
          <input
            type="range"
            id="rms-slider"
            min="0.0001"
            max="0.1"
            step="0.0002"
            value="0.001"
          />
          <span id="rms-value" class="setting-value">0.0010</span>
        </label>

        <label class="setting-row">
          <span>Cut&nbsp;(%)</span>
          <input
            type="range"
            id="peak-slider"
            min="0.05"
            max="0.5"
            step="0.01"
            value="0.2"
          />
          <span id="peak-value" class="setting-value">20%</span>
        </label>

        <label class="setting-row">
          <span>Min&nbsp;(Hz)</span>
          <input
            type="range"
            id="min-freq-slider"
            min="50"
            max="450"
            step="5"
            value="50"
          />
          <span id="min-freq-value" class="setting-value">50</span>
          <button id="preset-male-btn" class="preset-btn" title="Homme (75-150 Hz)">♂</button>
          <button id="preset-female-btn" class="preset-btn" title="Femme (175-275 Hz)">♀</button>
        </label>

        <label class="setting-row">
          <span>Max&nbsp;(Hz)</span>
          <input
            type="range"
            id="max-freq-slider"
            min="50"
            max="450"
            step="10"
            value="450"
          />
          <span id="max-freq-value" class="setting-value">450</span>
        </label>
      </section>

      <section id="graph-view" class="hidden">
        <canvas id="pitch-canvas"></canvas>
        <button id="clear-history-btn">Effacer historique</button>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
